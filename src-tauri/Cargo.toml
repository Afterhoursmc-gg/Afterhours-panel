[package]
name = "afterhours-panel"
version = "0.1.0"
description = "Afterhours operations desktop panel"
authors = ["Horii Developments"]
edition = "2021"

[lib]
name = "afterhours_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2.4"
